name: Publish to MCP Registry

# Publishes server.json to the MCP Registry whenever a GitHub release is cut
# (or manually via workflow_dispatch). Uses GitHub OIDC for auth, so no
# secrets are required; the registry's github-oidc provider verifies the
# commit signer's ownership of rwestergren/hevy-mcp.
#
# The version in server.json (both top-level and packages[].version) is
# auto-synced to the release tag so a single source of truth -- the git
# tag -- drives the registry entry version.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: mcp-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Sync server.json version to release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          # OCI packages encode the version in the identifier tag
          # (ghcr.io/owner/image:VERSION). The registry rejects a separate
          # version field on OCI packages and rejects registryBaseUrl too,
          # so the tag in identifier is the single source of truth. We
          # only rewrite the top-level server version and the identifier's
          # tag portion here.
          jq --arg v "$VERSION" '
            .version = $v
            | .packages[0].identifier = (
                (.packages[0].identifier | split(":")[0]) + ":" + $v
              )
          ' server.json > server.tmp
          mv server.tmp server.json
          echo "Synced server.json to version ${VERSION}"
          jq '{name, version, "package.identifier": .packages[0].identifier}' server.json

      - name: Wait for GHCR image tag to exist
        # The docker.yml workflow runs in parallel on `release: published`
        # and takes ~60-90s to build and push multi-arch images. The MCP
        # Registry validator refuses to publish if the referenced OCI tag
        # doesn't exist yet, so poll GHCR for the tag before publishing.
        run: |
          set -euo pipefail
          IMAGE=$(jq -r '.packages[0].identifier' server.json)
          REPO="${IMAGE%:*}"
          TAG="${IMAGE##*:}"
          # Strip ghcr.io/ prefix to get owner/image for the manifest API
          OWNER_IMAGE="${REPO#ghcr.io/}"
          # GHCR requires a bearer token for manifest queries even on
          # public images. Fetch an anonymous token scoped to pull.
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${OWNER_IMAGE}:pull" | jq -r .token)
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/${OWNER_IMAGE}/manifests/${TAG}")
            if [ "$CODE" = "200" ]; then
              echo "Tag ${IMAGE} is present on GHCR (attempt $i)."
              exit 0
            fi
            echo "Attempt $i: manifest for ${IMAGE} returned ${CODE}; waiting 10s..."
            sleep 10
          done
          echo "Timed out waiting for ${IMAGE} to appear on GHCR." >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
